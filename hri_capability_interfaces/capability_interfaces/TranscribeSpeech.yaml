%YAML 1.1
---
name: TranscribeSpeech
spec_version: 1.1
spec_type: interface
description: "Explicit single-window or continuous segmented audio capture and asynchronous speech-to-text."
interface:
  services:
    "/hri/speech/transcribe":
      type: "hri_capability_interfaces/srv/TranscribeSpeech"
      description: "Request future capture, optionally continuous until capability release. accepted is admission only."
  topics:
    "/hri/speech/transcript":
      type: "hri_capability_interfaces/msg/SpeechTranscript"
      description: "Correlated completion, text or explicit error. Not an authenticated command or measured confidence."
    "/hri/speech/capture_status":
      type: "hri_capability_interfaces/msg/SpeechCaptureStatus"
      description: "Continuous-capture heartbeat and bounded queue status; contains no audio or text."
